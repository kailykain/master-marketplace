;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Error handling and logging ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On

zend.assertions = -1
zend.exception_ignore_args = On

[opcache]
opcache.enable = 1
opcache.enable_cli = 1

; Выделяем память под кэш байт-кода (минимум 256MB для Symfony)
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16

; Максимальное количество файлов в кэше (для Symfony нужно много)
opcache.max_accelerated_files = 20000

; Включаем валидацию файлов только при деплое (0 означает "никогда не проверять изменения файлов на диске")
opcache.validate_timestamps = 0

; Механизм предзагрузки Symfony (укажите точный путь к вашему сгенерированному файлу предзагрузки)
; opcache.preload = /app/var/cache/prod/App_KernelProdContainerInlinedPreloader.php
opcache.preload_user = www-data